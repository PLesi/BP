<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WebRTC Test Client</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 900px;
      margin: 24px auto;
      padding: 0 16px;
      line-height: 1.4;
    }
    .row {
      display: grid;
      grid-template-columns: 170px 1fr;
      gap: 8px;
      margin-bottom: 8px;
      align-items: center;
    }
    input {
      padding: 8px;
      width: 100%;
      box-sizing: border-box;
    }
    button {
      margin-right: 8px;
      margin-top: 8px;
      padding: 8px 12px;
      cursor: pointer;
    }
    video {
      width: 100%;
      max-width: 860px;
      background: #111;
      margin-top: 12px;
    }
    pre {
      background: #f5f5f5;
      padding: 10px;
      overflow: auto;
      max-height: 220px;
      border: 1px solid #ddd;
    }
  </style>
</head>
<body>
  <h2>WebRTC Test Client</h2>

  <div class="row">
    <label for="baseUrl">Base URL</label>
    <input id="baseUrl" value="http://localhost:8000" />
  </div>
  <div class="row">
    <label for="deviceName">Device Name</label>
    <input id="deviceName" value="uDAQ28LT" />
  </div>
  <div class="row">
    <label for="apiKey">X-API-Key</label>
    <input id="apiKey" placeholder="Required for Generate Grant" />
  </div>
  <div class="row">
    <label for="grantToken">Grant Token</label>
    <input id="grantToken" placeholder="Will be filled automatically" />
  </div>
  <div class="row">
    <label for="iceUrl">ICE (STUN) URL</label>
    <input id="iceUrl" value="stun:stun.l.google.com:19302" />
  </div>

  <div class="row">
    <label for="wsDeviceName">WS Device Name</label>
    <input id="wsDeviceName" value="uDAQ28LT" />
  </div>
  <div class="row">
    <label for="wsSoftwareName">WS Software Name</label>
    <input id="wsSoftwareName" value="MATLAB" />
  </div>
  <div class="row">
    <label for="wsTaskId">WS Task ID</label>
    <input id="wsTaskId" placeholder="Filled after Run WS Test" />
  </div>

  <button id="btnGrant">1) Generate Grant</button>
  <button id="btnStart">2) Start Stream</button>
  <button id="btnStop">3) Stop Stream</button>
  <button id="btnWsRun">4) Run WS Test Experiment</button>
  <button id="btnWsConnect">5) Connect WS by Task ID</button>
  <button id="btnWsDisconnect">6) Disconnect WS</button>

  <video id="video" autoplay playsinline controls></video>

  <h3>Log</h3>
  <pre id="log"></pre>

  <h3>Connection stats</h3>
  <pre id="stats">Not connected.</pre>

  <h3>WebSocket log</h3>
  <pre id="wsLog">Disconnected.</pre>

  <script>
    let pc = null;
    let ws = null;
    let statsTimer = null;
    let prevInboundBytes = null;
    let prevInboundTs = null;

    const el = {
      baseUrl: document.getElementById('baseUrl'),
      deviceName: document.getElementById('deviceName'),
      apiKey: document.getElementById('apiKey'),
      grantToken: document.getElementById('grantToken'),
      iceUrl: document.getElementById('iceUrl'),
      wsDeviceName: document.getElementById('wsDeviceName'),
      wsSoftwareName: document.getElementById('wsSoftwareName'),
      wsTaskId: document.getElementById('wsTaskId'),
      video: document.getElementById('video'),
      log: document.getElementById('log'),
      stats: document.getElementById('stats'),
      wsLog: document.getElementById('wsLog'),
      btnGrant: document.getElementById('btnGrant'),
      btnStart: document.getElementById('btnStart'),
      btnStop: document.getElementById('btnStop'),
      btnWsRun: document.getElementById('btnWsRun'),
      btnWsConnect: document.getElementById('btnWsConnect'),
      btnWsDisconnect: document.getElementById('btnWsDisconnect')
    };

    function resetStats() {
      prevInboundBytes = null;
      prevInboundTs = null;
      el.stats.textContent = 'Not connected.';
    }

    function stopStatsPolling() {
      if (statsTimer) {
        clearInterval(statsTimer);
        statsTimer = null;
      }
    }

    async function updateStats() {
      if (!pc || pc.connectionState === 'closed') {
        return;
      }

      const report = await pc.getStats();
      let inbound = null;
      let candidatePair = null;

      report.forEach((s) => {
        if (!inbound && s.type === 'inbound-rtp' && s.kind === 'video') {
          inbound = s;
        }
        if (!candidatePair && s.type === 'candidate-pair' && s.nominated && s.state === 'succeeded') {
          candidatePair = s;
        }
      });

      if (!inbound) {
        el.stats.textContent = 'Connected, waiting for inbound video stats...';
        return;
      }

      let bitrateKbps = 0;
      if (prevInboundBytes !== null && prevInboundTs !== null) {
        const bytesDelta = inbound.bytesReceived - prevInboundBytes;
        const msDelta = inbound.timestamp - prevInboundTs;
        if (msDelta > 0 && bytesDelta >= 0) {
          bitrateKbps = (bytesDelta * 8) / msDelta;
        }
      }
      prevInboundBytes = inbound.bytesReceived;
      prevInboundTs = inbound.timestamp;

      const width = inbound.frameWidth || 0;
      const height = inbound.frameHeight || 0;
      const fps = inbound.framesPerSecond || 0;
      const packetsLost = inbound.packetsLost || 0;
      const packetsReceived = inbound.packetsReceived || 0;
      const lossPct = (packetsLost + packetsReceived) > 0
        ? (packetsLost * 100) / (packetsLost + packetsReceived)
        : 0;
      const jitterMs = inbound.jitter ? inbound.jitter * 1000 : 0;
      const rttMs = candidatePair && candidatePair.currentRoundTripTime
        ? candidatePair.currentRoundTripTime * 1000
        : 0;

      el.stats.textContent = [
        `State: ${pc.connectionState}`,
        `Resolution: ${width}x${height}`,
        `FPS: ${fps.toFixed(1)}`,
        `Bitrate: ${bitrateKbps.toFixed(0)} kbps`,
        `Packets lost: ${packetsLost} (${lossPct.toFixed(2)}%)`,
        `Jitter: ${jitterMs.toFixed(1)} ms`,
        `RTT: ${rttMs.toFixed(1)} ms`
      ].join('\n');
    }

    function startStatsPolling() {
      stopStatsPolling();
      resetStats();
      statsTimer = setInterval(() => {
        updateStats().catch((e) => {
          el.stats.textContent = `Stats error: ${e.message}`;
        });
      }, 2000);
    }

    function log(msg) {
      const line = `[${new Date().toLocaleTimeString()}] ${msg}`;
      el.log.textContent += line + '\n';
      el.log.scrollTop = el.log.scrollHeight;
      console.log(line);
    }

    function wsLog(msg) {
      const line = `[${new Date().toLocaleTimeString()}] ${msg}`;
      el.wsLog.textContent += line + '\n';
      el.wsLog.scrollTop = el.wsLog.scrollHeight;
      console.log(line);
    }

    function extractChartPoint(data) {
      if (!data || typeof data !== 'object') {
        return null;
      }

      const time = Number(data.time);
      if (!Number.isFinite(time)) {
        return null;
      }

      const point = { time };
      let hasValue = false;

      for (const [k, v] of Object.entries(data)) {
        if (k === 'time' || k === 'status' || k === 'sim_status' || k === 'out_line' || k === 'log') {
          continue;
        }
        if (typeof v === 'number' && Number.isFinite(v)) {
          point[k] = v;
          hasValue = true;
        }
      }

      return hasValue ? point : null;
    }

    function endpoints() {
      const base = el.baseUrl.value.replace(/\/$/, '');
      const device = encodeURIComponent(el.deviceName.value.trim());
      return {
        grants: `${base}/api/server/devices/${device}/webrtc/grants`,
        offer: `${base}/api/server/devices/${device}/webrtc/offer`,
        stop: `${base}/api/server/devices/${device}/webrtc/stop`,
        runExperiment: `${base}/experiments/run`
      };
    }

    function wsBaseUrl() {
      const base = el.baseUrl.value.replace(/\/$/, '');
      return base
        .replace(/^http:\/\//i, 'ws://')
        .replace(/^https:\/\//i, 'wss://');
    }

    function makeWsExperimentPayload() {
      return {
        command: 'start',
        device_name: el.wsDeviceName.value.trim(),
        software_name: el.wsSoftwareName.value.trim(),
        simulation_time: 60,
        sample_rate: 10,
        setpoint_changes: {
          start_value: 0,
          steps: []
        },
        input_arguments: {
          bulb: { value: 100, type: 'number', unit: '%', order: 1 },
          fan: { value: 0, type: 'number', unit: '%', order: 2 },
          led: { value: 100, type: 'number', unit: '%', order: 3 },
          reg_output: { value: 'light_intensity', type: 'string', unit: '-', order: 4 },
          reg_signal: { value: 'bulb', type: 'string', unit: '-', order: 5 },
          reg_target: { value: 35, type: 'number', unit: 'lx', order: 6 },
          Kc: { value: 2, type: 'number', unit: '-', order: 7 },
          Ti: { value: 1, type: 'number', unit: 's', order: 8 },
          U_min: { value: 0, type: 'number', unit: 'V', order: 9 },
          U_max: { value: 5, type: 'number', unit: 'V', order: 10 }
        },
        output_arguments: ['light_intensity']
      };
    }

    function disconnectWs() {
      if (ws) {
        ws.close();
        ws = null;
      }
    }

    function connectWsByTaskId(taskId) {
      if (!taskId) {
        throw new Error('Task ID is required to connect WebSocket.');
      }

      disconnectWs();
      const url = `${wsBaseUrl()}/experiments/ws/${encodeURIComponent(taskId)}`;
      wsLog(`Connecting to ${url} ...`);

      ws = new WebSocket(url);
      ws.onopen = () => wsLog('WebSocket connected.');
      ws.onclose = () => wsLog('WebSocket disconnected.');
      ws.onerror = () => wsLog('WebSocket error.');
      ws.onmessage = (ev) => {
        let msg;
        try {
          msg = JSON.parse(ev.data);
        } catch (e) {
          wsLog(`Invalid JSON from server: ${ev.data}`);
          return;
        }

        const safeDeviceId = msg.device_id ?? null;
        wsLog(`Message: ${JSON.stringify(msg)}`);

        if (msg.status === 'running' && msg.data && typeof msg.data === 'object') {
          const point = extractChartPoint(msg.data);
          if (point) {
            wsLog(`Chart point: device_id=${safeDeviceId}, t=${point.time}, values=${JSON.stringify(point)}`);
          }
        }
      };
    }

    async function runWsTestExperiment() {
      const { runExperiment } = endpoints();
      const payload = makeWsExperimentPayload();

      if (!payload.device_name) {
        throw new Error('WS Device Name is required.');
      }
      if (!payload.software_name) {
        throw new Error('WS Software Name is required.');
      }

      wsLog('Queueing test experiment...');
      const res = await fetch(runExperiment, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'accept': 'application/json'
        },
        body: JSON.stringify(payload)
      });

      const body = await res.json().catch(() => ({}));
      if (!res.ok) {
        throw new Error(`Run experiment failed: ${res.status} ${JSON.stringify(body)}`);
      }

      const taskId = body.task_id;
      if (!taskId) {
        throw new Error('Backend did not return task_id.');
      }

      el.wsTaskId.value = taskId;
      wsLog(`Experiment queued with task_id=${taskId}`);
      connectWsByTaskId(taskId);
    }

    async function generateGrant() {
      const { grants } = endpoints();
      const apiKey = el.apiKey.value.trim();
      if (!apiKey) {
        alert('Please fill X-API-Key first.');
        return;
      }

      log('Requesting grant token...');
      const res = await fetch(grants, {
        method: 'POST',
        headers: {
          'X-API-Key': apiKey,
          'accept': 'application/json'
        }
      });

      const data = await res.json().catch(() => ({}));
      if (!res.ok) {
        throw new Error(`Grant failed: ${res.status} ${JSON.stringify(data)}`);
      }

      el.grantToken.value = data.grant_token || '';
      log(`Grant OK, expires_at=${data.expires_at}`);
    }

    async function startStream() {
      const { offer } = endpoints();
      const token = el.grantToken.value.trim();
      const iceUrl = el.iceUrl.value.trim();
      if (!token) {
        alert('Missing grant token. Generate it first.');
        return;
      }

      if (pc) {
        pc.close();
      }

      stopStatsPolling();
      resetStats();

      const iceServers = [];
      if (iceUrl) {
        iceServers.push({ urls: iceUrl });
      }

      pc = new RTCPeerConnection({ iceServers });

      pc.ontrack = (ev) => {
        el.video.srcObject = ev.streams[0];
        log('Video track received.');
      };

      pc.onconnectionstatechange = () => {
        log(`Connection state: ${pc.connectionState}`);
        if (pc.connectionState === 'connected') {
          startStatsPolling();
        }
        if (pc.connectionState === 'failed' || pc.connectionState === 'closed' || pc.connectionState === 'disconnected') {
          stopStatsPolling();
        }
      };

      // We want to receive video from server.
      pc.addTransceiver('video', { direction: 'recvonly' });

      const localOffer = await pc.createOffer();
      await pc.setLocalDescription(localOffer);

      log('Sending SDP offer to backend...');
      const res = await fetch(offer, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'accept': 'application/json',
          'grant-token': token
        },
        body: JSON.stringify({
          type: pc.localDescription.type,
          sdp: pc.localDescription.sdp
        })
      });

      const answer = await res.json().catch(() => ({}));
      if (!res.ok) {
        throw new Error(`Offer failed: ${res.status} ${JSON.stringify(answer)}`);
      }

      await pc.setRemoteDescription(answer);
      log('Remote SDP answer applied. Stream should start soon.');
    }

    async function stopStream() {
      const { stop } = endpoints();
      const token = el.grantToken.value.trim();

      if (token) {
        const res = await fetch(stop, {
          method: 'POST',
          headers: {
            'accept': 'application/json',
            'grant-token': token
          }
        });
        const body = await res.json().catch(() => ({}));
        log(`Stop response: ${res.status} ${JSON.stringify(body)}`);
      }

      if (pc) {
        pc.close();
        pc = null;
      }
      stopStatsPolling();
      resetStats();
      el.video.srcObject = null;
      log('Local connection closed.');
    }

    el.btnGrant.addEventListener('click', () => {
      generateGrant().catch((e) => {
        log(e.message);
        alert(e.message);
      });
    });

    el.btnStart.addEventListener('click', () => {
      startStream().catch((e) => {
        log(e.message);
        alert(e.message);
      });
    });

    el.btnStop.addEventListener('click', () => {
      stopStream().catch((e) => {
        log(e.message);
        alert(e.message);
      });
    });

    el.btnWsRun.addEventListener('click', () => {
      runWsTestExperiment().catch((e) => {
        wsLog(e.message);
        alert(e.message);
      });
    });

    el.btnWsConnect.addEventListener('click', () => {
      try {
        connectWsByTaskId(el.wsTaskId.value.trim());
      } catch (e) {
        wsLog(e.message);
        alert(e.message);
      }
    });

    el.btnWsDisconnect.addEventListener('click', () => {
      disconnectWs();
    });
  </script>
</body>
</html>
